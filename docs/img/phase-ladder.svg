<svg xmlns="http://www.w3.org/2000/svg" width="810" height="360" viewBox="0 0 810 360" role="img" aria-label="The nine lifecycle phases plotted against the default model tier assigned to each">
  <rect x="0" y="0" width="810" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Default tier per phase</text>
  <text x="20" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b7280">The tier assigned by phase alone, before demand, error cost and trajectory adjustments are applied.</text>

  <!-- row guides -->
  <rect x="100" y="98" width="700" height="44" fill="#CB4136" fill-opacity="0.05"/>
  <rect x="100" y="152" width="700" height="44" fill="#A87B0B" fill-opacity="0.05"/>
  <rect x="100" y="206" width="700" height="44" fill="#0C8A6C" fill-opacity="0.05"/>
  <rect x="100" y="260" width="700" height="44" fill="#9ca3af" fill-opacity="0.07"/>

  <text x="92" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#CB4136" text-anchor="end">Opus</text>
  <text x="92" y="179" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#A87B0B" text-anchor="end">Sonnet</text>
  <text x="92" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0C8A6C" text-anchor="end">Haiku</text>
  <text x="92" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">hold</text>
  <text x="92" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">tier 2</text>
  <text x="92" y="296" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">no call</text>

  <!-- plan: Opus -->
  <rect x="256" y="103" width="74" height="34" rx="4" fill="#CB4136" fill-opacity="0.18" stroke="#CB4136" stroke-opacity="0.45"/>
  <text x="293" y="125" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#CB4136" text-anchor="middle">plan</text>

  <!-- clarify, implement, debug, review: Sonnet -->
  <rect x="100" y="157" width="74" height="34" rx="4" fill="#A87B0B" fill-opacity="0.18" stroke="#A87B0B" stroke-opacity="0.45"/>
  <text x="137" y="179" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A87B0B" text-anchor="middle">clarify</text>
  <rect x="334" y="157" width="74" height="34" rx="4" fill="#A87B0B" fill-opacity="0.18" stroke="#A87B0B" stroke-opacity="0.45"/>
  <text x="371" y="179" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#A87B0B" text-anchor="middle">implement</text>
  <rect x="412" y="157" width="74" height="34" rx="4" fill="#A87B0B" fill-opacity="0.18" stroke="#A87B0B" stroke-opacity="0.45"/>
  <text x="449" y="179" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A87B0B" text-anchor="middle">debug</text>
  <rect x="568" y="157" width="74" height="34" rx="4" fill="#A87B0B" fill-opacity="0.18" stroke="#A87B0B" stroke-opacity="0.45"/>
  <text x="605" y="179" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#A87B0B" text-anchor="middle">review</text>

  <!-- explore, verify, integrate: Haiku -->
  <rect x="178" y="211" width="74" height="34" rx="4" fill="#0C8A6C" fill-opacity="0.18" stroke="#0C8A6C" stroke-opacity="0.45"/>
  <text x="215" y="233" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0C8A6C" text-anchor="middle">explore</text>
  <rect x="490" y="211" width="74" height="34" rx="4" fill="#0C8A6C" fill-opacity="0.18" stroke="#0C8A6C" stroke-opacity="0.45"/>
  <text x="527" y="233" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0C8A6C" text-anchor="middle">verify</text>
  <rect x="646" y="211" width="74" height="34" rx="4" fill="#0C8A6C" fill-opacity="0.18" stroke="#0C8A6C" stroke-opacity="0.45"/>
  <text x="683" y="233" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0C8A6C" text-anchor="middle">integrate</text>

  <!-- housekeeping: hold -->
  <rect x="724" y="265" width="74" height="34" rx="4" fill="#9ca3af" fill-opacity="0.18" stroke="#9ca3af" stroke-dasharray="3 2"/>
  <text x="761" y="287" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">housekeeping</text>

  <!-- sdlc direction -->
  <line x1="100" y1="322" x2="792" y2="322" stroke="#d1d5db" stroke-width="1"/>
  <polygon points="792,322 784,318 784,326" fill="#d1d5db"/>
  <text x="100" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#9ca3af">phases of one work unit, in typical order; the tier is re-evaluated on each request</text>

  <text x="20" y="356" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#9ca3af">Source: the phase table in jev_ontology.pick_tier_v2. housekeeping returns tier=None, holding the current tier without a classifier request.</text>
</svg>
